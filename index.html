  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #111316;
      --card-bg: #181b1f;
      --border: #262b33;
      --border-subtle: #1e2229;
      --text-main: #eceff4;
      --text-muted: #838e9d;
      --text-dim: #545e6d;
      --accent: #d8dee9;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, "Courier New", monospace;
    }

    [data-theme="light"] {
      --bg: #f5f6f8;
      --card-bg: #ffffff;
      --border: #e2e5ea;
      --border-subtle: #edf0f4;
      --text-main: #181b1f;
      --text-muted: #647082;
      --text-dim: #9aa5b5;
      --accent: #2e3440;
    }

    [data-theme="mono"] {
      --bg: #000000;
      --card-bg: #0a0a0a;
      --border: #222222;
      --border-subtle: #141414;
      --text-main: #ffffff;
      --text-muted: #888888;
      --text-dim: #444444;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Top Bar */
    header {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-main);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    /* Main Viewport */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px 28px;
      gap: 12px;
    }

    /* Slide Header */
    .slide-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .meta-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .slide-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .slide-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .slide-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .meta-right {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    /* Diptych Container */
    .diptych-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      min-height: 0;
    }

    .pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .pane-media {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      min-height: 0;
      overflow: hidden;
      cursor: zoom-in;
    }

    .pane-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pane-media img.loaded {
      opacity: 1;
    }

    .pane-media:hover img.loaded {
      transform: scale(1.015);
    }

    .pane-caption {
      height: 32px;
      padding: 0 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.1);
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .pane-tag {
      color: var(--text-dim);
    }

    /* Cover / Closing Layout */
    .single-pane-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .hero-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .hero-title {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .hero-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 600px;
      line-height: 1.5;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .hero-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 24px;
      display: flex;
      gap: 32px;
    }

    /* Bottom Navigation Bar */
    footer {
      height: 48px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 380px;
      margin: 0 20px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease;
    }

    .key-hint {
      color: var(--text-dim);
      font-size: 10px;
      display: flex;
      gap: 10px;
    }

    .kbd {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--text-muted);
    }

    /* Gallery Drawer Modal */
    .gallery-overlay {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 12, 14, 0.95);
      backdrop-filter: blur(16px);
      z-index: 100;
      padding: 24px 30px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .gallery-overlay.active {
      display: flex;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .gallery-title {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.15s;
    }

    .gallery-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .gallery-card.current {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .gallery-card-thumb {
      height: 105px;
      background: #000;
      border-radius: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      overflow: hidden;
      padding: 3px;
    }

    .gallery-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--card-bg);
    }

    .gallery-card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .gallery-card-id {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
    }

    .gallery-card-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.96);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      cursor: zoom-out;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 92vh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border-radius: 4px;
    }

    /* Print Styles */
    @media print {
      @page {
        size: landscape;
        margin: 0;
      }
      body {
        height: auto;
        overflow: visible;
        background: #ffffff !important;
        color: #000000 !important;
      }
      header, footer, .gallery-overlay, .lightbox-modal {
        display: none !important;
      }
      .slide-stage {
        page-break-after: always;
        height: 100vh;
        padding: 24px 36px;
        box-sizing: border-box;
      }
      .pane {
        background: #ffffff !important;
        border: 1px solid #cccccc !important;
      }
      .pane-caption {
        background: #f8f9fa !important;
        border-top: 1px solid #eeeeee !important;
        color: #555555 !important;
      }
      .slide-title, .hero-title {
        color: #000000 !important;
      }
      .slide-badge, .slide-subtitle, .hero-subtitle {
        color: #444444 !important;
      }
      .pane-media img {
        opacity: 1 !important;
      }
    }
  </style>
</head>

    let currentIndex = 0;
    const themes = ["dark", "light", "mono"];
    let currentThemeIdx = 0;

    const slideStage = document.getElementById("slideStage");
    const slideCounter = document.getElementById("slideCounter");
    const progressBar = document.getElementById("progressBar");
    const galleryModal = document.getElementById("galleryModal");
    const galleryGrid = document.getElementById("galleryGrid");
    const lightboxModal = document.getElementById("lightboxModal");
    const lightboxImg = document.getElementById("lightboxImg");

    // Smart preloader cache
    const cache = new Set();
    function preloadImage(url) {
      if (!url || cache.has(url)) return;
      const img = new Image();
      img.src = url;
      cache.add(url);
    }

    function preloadNearby(idx) {
      [-1, 1, 2].forEach(offset => {
        const target = idx + offset;
        if (target >= 0 && target < slides.length) {
          const s = slides[target];
          if (s.left_img) preloadImage(s.left_img);
          if (s.right_img) preloadImage(s.right_img);
        }
      });
    }

    function renderSlide(index) {
      const s = slides[index];
      const isCover = s.type === "cover";
      const isClosing = s.type === "closing";

      if (isCover || isClosing) {
        slideStage.innerHTML = `
          <div class="single-pane-center">
            <div class="hero-badge">${isCover ? "RADOŠĀ UN PROFESIONĀLĀ MŪŽA PORTFOLIO" : "AUTORA REZUMĒ"}</div>
            <h1 class="hero-title">${s.title}</h1>
            <div class="hero-subtitle">${s.subtitle}</div>
            <div class="hero-meta">
              <span>PERIODS: 2008 – 2026</span>
              <span>LOKĀCIJA: RĪGA, LATVIJA</span>
              <span>DISCIPLĪNAS: ARHITEKTŪRA · INŽENIERIJA · METĀLKONSTRUKCIJAS</span>
            </div>
          </div>
        `;
      } else {
        slideStage.innerHTML = `
          <div class="slide-meta">
            <div class="meta-left">
              <span class="slide-badge">${s.id} / ${s.category} · ${s.year}</span>
              <h2 class="slide-title">${s.title}</h2>
              <p class="slide-subtitle">${s.subtitle}</p>
            </div>
            <div class="meta-right">
              ${index + 1} / ${slides.length}
            </div>
          </div>
          <div class="diptych-grid">
            <div class="pane">
              <div class="pane-media" onclick="openLightbox('${s.left_img}')">
                <img src="${s.left_img}" alt="Drawing" loading="eager" decoding="async" onload="this.classList.add('loaded')">
              </div>
              <div class="pane-caption">
                <span>${s.left_label || "PROJEKTS / RASĒJUMS"}</span>
                <span class="pane-tag">[CAD / STAGE]</span>
              </div>
            </div>
            <div class="pane">
              <div class="pane-media" onclick="openLightbox('${s.right_img}')">
                <img src="${s.right_img}" alt="Realization" loading="eager" decoding="async" onload="this.classList.add('loaded')">
              </div>
              <div class="pane-caption">
                <span>${s.right_label || "REALIZĀCIJA / DARBĪBA"}</span>
                <span class="pane-tag">[BUILT / CONTEXT]</span>
              </div>
            </div>
          </div>
        `;
      }

      const displayId = (index + 1).toString().padStart(2, "0");
      slideCounter.innerText = `${displayId} / ${slides.length.toString().padStart(2, "0")}`;
      const pct = ((index + 1) / slides.length) * 100;
      progressBar.style.width = pct + "%";

      updateGallerySelection();
      preloadNearby(index);
    }

    function goToSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= slides.length) idx = slides.length - 1;
      currentIndex = idx;
      renderSlide(currentIndex);
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        goToSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    let galleryBuilt = false;
    function toggleGallery() {
      const isActive = galleryModal.classList.toggle("active");
      if (isActive && !galleryBuilt) {
        buildGallery();
        galleryBuilt = true;
      }
    }

    function buildGallery() {
      galleryGrid.innerHTML = "";
      slides.forEach((s, idx) => {
        const card = document.createElement("div");
        card.className = "gallery-card" + (idx === currentIndex ? " current" : "");
        card.onclick = () => {
          goToSlide(idx);
          galleryModal.classList.remove("active");
        };

        let thumbsHtml = "";
        // Use lightweight dedicated thumbnails (360px WebP)
        const leftThumb = s.left_thumb || s.left_img;
        const rightThumb = s.right_thumb || s.right_img;
        
        if (leftThumb && rightThumb) {
          thumbsHtml = `
            <div class="gallery-card-thumb">
              <img src="${leftThumb}" alt="L" loading="lazy" decoding="async">
              <img src="${rightThumb}" alt="R" loading="lazy" decoding="async">
            </div>
          `;
        } else {
          thumbsHtml = `
            <div class="gallery-card-thumb" style="grid-template-columns:1fr; align-items:center; justify-content:center; background:#181b1f;">
              <span style="font-family:var(--font-mono); font-size:10px; color:var(--text-dim); text-align:center;">${s.title}</span>
            </div>
          `;
        }

        card.innerHTML = `
          ${thumbsHtml}
          <div class="gallery-card-info">
            <span class="gallery-card-id">${s.id} · ${s.category}</span>
            <span class="gallery-card-title">${s.title}</span>
          </div>
        `;
        galleryGrid.appendChild(card);
      });
    }

    function updateGallerySelection() {
      const cards = document.querySelectorAll(".gallery-card");
      cards.forEach((c, idx) => {
        c.classList.toggle("current", idx === currentIndex);
      });
    }

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxModal.classList.add("active");
    }

    lightboxModal.onclick = () => {
      lightboxModal.classList.remove("active");
    };

    document.getElementById("prevBtn").onclick = prevSlide;
    document.getElementById("nextBtn").onclick = nextSlide;
    document.getElementById("galleryBtn").onclick = toggleGallery;
    document.getElementById("closeGalleryBtn").onclick = toggleGallery;

    document.getElementById("themeBtn").onclick = () => {
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      document.body.setAttribute("data-theme", themes[currentThemeIdx]);
    };

    document.getElementById("fullscreenBtn").onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    document.getElementById("printBtn").onclick = () => {
      window.print();
    };

    document.getElementById("progressTrack").onclick = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      const targetIdx = Math.floor(pos * slides.length);
      goToSlide(targetIdx);
    };

    window.addEventListener("keydown", (e) => {
      if (lightboxModal.classList.contains("active")) {
        if (e.key === "Escape") lightboxModal.classList.remove("active");
        return;
      }

      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
      } else if (e.key === "Home") {
        e.preventDefault();
        goToSlide(0);
      } else if (e.key === "End") {
        e.preventDefault();
        goToSlide(slides.length - 1);
      } else if (e.key.toLowerCase() === "g") {
        toggleGallery();
      } else if (e.key.toLowerCase() === "f") {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      } else if (e.key === "Escape") {
        galleryModal.classList.remove("active");
      }
    });

    // Initialize first slide and preload adjacent
    renderSlide(0);
  </script>
